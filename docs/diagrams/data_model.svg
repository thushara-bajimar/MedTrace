<g font-weight="600" fill="#0f172a"><text x="40" y="80">patients</text><text x="40" y="220">users · patient_access</text><text x="280" y="80">documents</text><text x="280" y="250">document_pages</text><text x="280" y="360">page_lines</text><text x="540" y="80">findings (evidence)</text><text x="540" y="280">finding_versions</text><text x="800" y="80">*_details</text><text x="540" y="410">conflicts</text><text x="800" y="320">duplicate_candidates</text><text x="800" y="430">gaps</text></g>
