<text x="40" y="240">role: admin/reviewer/viewer</text><text x="40" y="256">permission: read/write</text>
<text x="280" y="100">patient_id FK, sha256</text><text x="280" y="116">doc_type (+ original)</text><text x="280" y="132">document_date_text / iso / status</text><text x="280" y="148">ocr_status, text_source_summary</text><text x="280" y="164">injection_flags</text>
<text x="280" y="270">text + original_text</text><text x="280" y="286">text_source (native/ocr/human)</text>
<text x="280" y="380">text + bbox + OCR confidence</text>
<text x="540" y="100">patient_id, document_id FK</text><text x="540" y="116">page, line_start/end</text><text x="540" y="132">source_passage, original_text</text><text x="540" y="148">date_text, date_iso, date_status</text><text x="540" y="164">confidence + reasons</text><text x="540" y="180">verification, provenance_type</text><text x="540" y="196">temporal_status, is_active</text>
<text x="540" y="300">version, origin machine/human</text><text x="540" y="316">data_json, reason, reviewer</text>
<text x="800" y="100">condition_details</text><text x="800" y="120">medication_details</text><text x="800" y="140">allergy_details</text><text x="800" y="160">investigation_details</text><text x="800" y="180">event_details</text><text x="800" y="205">(current version,</text><text x="800" y="221">typed querying)</text>
<text x="540" y="430">category, evidence_json</text><text x="540" y="446">status + conflict_resolutions</text><text x="540" y="462">conflict_findings (M:N)</text>
<text x="800" y="340">level document/finding</text><text x="800" y="356">kind, review_status</text>
<text x="800" y="450">derived documentation gaps</text>
