<rect x="30" y="60" width="170" height="90" rx="6"/><rect x="30" y="200" width="170" height="70" rx="6"/>
<rect x="270" y="60" width="190" height="120" rx="6"/><rect x="270" y="230" width="190" height="70" rx="6"/><rect x="270" y="340" width="190" height="60" rx="6"/>
