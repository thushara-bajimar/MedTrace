<rect x="790" y="60" width="150" height="190" rx="6"/><rect x="530" y="390" width="200" height="80" rx="6"/><rect x="790" y="300" width="150" height="80" rx="6"/><rect x="790" y="410" width="150" height="70" rx="6"/>
